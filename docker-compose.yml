services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: examlms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-examlms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-examlms_password}
      POSTGRES_DB: ${DB_NAME:-examlms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-examlms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examlms-network

  redis:
    image: redis:7-alpine
    container_name: examlms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - examlms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examlms-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://${DB_USER:-examlms}:${DB_PASSWORD:-examlms_password}@postgres:5432/${DB_NAME:-examlms}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - examlms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examlms-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_PROXY_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - examlms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  examlms-network:
    driver: bridge
