<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamLMS</title>
    <script>
      // Applied synchronously, before first paint, so switching pages or
      // reloading never flashes the wrong theme. Falls back to the OS
      // preference (handled by CSS media query) when nothing is stored.
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
